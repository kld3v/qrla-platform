version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2
      nodejs: 22
    commands:
      - echo "Starting installation phase..."
      - curl -sS https://getcomposer.org/installer | php
      - mv composer.phar /usr/local/bin/composer
      - echo "Composer installed successfully."

  pre_build:
    commands:
      - echo "Installing PHP dependencies..."
      - composer install --no-interaction --prefer-dist --optimize-autoloader --dev
      - echo "Installing Node.js dependencies and building assets..."
      - npm ci
      - npm run build

  build:
    commands:
      - echo "Skipping tests and migrations due to lack of database connection."

  post_build:
    commands:
      - echo "Clearing cache..."
      - php artisan config:cache
      - php artisan route:cache
      - php artisan view:cache
      - echo "Cache cleared successfully."
      - echo "Inspecting packaged files..."
      - ls -al

artifacts:
  files:
    - 'app/**/*'
    - 'bootstrap/**/*'
    - 'config/**/*'
    - 'database/**/*'
    - 'public/**/*'
    - 'resources/**/*'
    - 'routes/**/*'
    - 'storage/**/*'
    - 'vendor/**/*'
    - '.platform/**/*'        # Include platform hooks
    - '.ebextensions/**/*'    # Include EB configurations
    - 'artisan'               # Include Laravel CLI
  discard-paths: no

cache:
  paths:
    - '$HOME/.cache/composer/**/*'
    - 'node_modules/**/*'
