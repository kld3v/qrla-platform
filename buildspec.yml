version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.2  # Set to PHP 8.2
      nodejs: 22  # Node.js version for frontend assets
    commands:
      - echo "Starting installation phase..."

      # Install Composer
      - echo "Installing Composer..."
      - curl -sS https://getcomposer.org/installer | php
      - mv composer.phar /usr/local/bin/composer
      - echo "Composer installed successfully."

  pre_build:
    commands:
      # Install PHP dependencies with Composer
      - echo "Installing PHP dependencies..."
      - composer install --no-dev --prefer-dist --optimize-autoloader

      # Install Node.js dependencies and build assets
      - echo "Installing Node.js dependencies and building assets..."
      - npm ci
      - npm run build  # Use your actual build command, if different

  build:
    commands:
      # Run PHP unit tests (assuming tests don’t need a database)
      - echo "Running tests..."
      - php artisan test

  post_build:
    commands:
      # Clear Laravel cache
      - echo "Clearing cache..."
      - php artisan config:cache
      - php artisan route:cache
      - php artisan view:cache
      - echo "Cache cleared successfully."

artifacts:
  files:
    - 'app/**'
    - 'bootstrap/**'
    - 'public/**'
    - 'resources/**'
    - 'routes/**'
    - 'vendor/**'
    - 'composer.json'
    - 'composer.lock'
    - 'package.json'
    - 'package-lock.json'
  discard-paths: no

cache:
  paths:
    - '$HOME/.cache/composer/**/*'
    - 'node_modules/**/*'
